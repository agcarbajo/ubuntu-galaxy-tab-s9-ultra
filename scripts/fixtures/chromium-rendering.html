<!doctype html><meta charset="utf-8"><style>body{margin:16px;background:#fafafa;font:18px sans-serif}.gradient{height:260px;background:radial-gradient(ellipse at 30% 100%,#4441b4 0%,#24225b 48%,#101022 100%);border-radius:20px;color:white;padding:20px;position:relative}.gradient:after{content:'';position:absolute;inset:0;backdrop-filter:blur(1px);border-radius:20px}canvas{width:900px;height:330px}p{margin:4px}#lines{height:100px;overflow:auto;transform:translateZ(0)}</style>
<div class="gradient"><h1>Prueba — degradados y transparencias</h1><p>Texto blanco sobre fondo • áéíóú ñ 🎮 🎵 🍎 📱</p></div><canvas id="c" width="1800" height="660"></canvas><div id="lines"></div><pre id="result"></pre>
<script>
const ctx=c.getContext('2d');ctx.scale(2,2);function draw(){ctx.fillStyle='white';ctx.fillRect(0,0,900,330);ctx.fillStyle='#545cbc';ctx.fillRect(0,0,900,35);ctx.font='18px Arial';ctx.fillStyle='white';ctx.fillText('Nombre                    Artista                Año de compra       Tipo',12,25);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#f2f5f7':'#fff';ctx.fillRect(0,35+i*28,900,28);ctx.fillStyle='#222';ctx.font=(i%2?'bold ':'')+'18px Arial';ctx.fillText(['¿Quién es Billie Max?','Elige Tu Propia Aventura','Ya Viene el Sol'][i%3],12,56+i*28);ctx.fillText('Ginebras · Mecano · La La Love You',280,56+i*28);ctx.fillText('2026     Vinilo / CD',680,56+i*28)}}draw();
for(let i=0;i<40;i++){let p=document.createElement('p');p.textContent='Ofimática — áéíóú — letras y símbolos '+i;lines.appendChild(p)}
let gl=document.createElement('canvas').getContext('webgl2');let dbg=gl&&gl.getExtension('WEBGL_debug_renderer_info');result.textContent=JSON.stringify({webgl:!!gl,vendor:dbg&&gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),renderer:dbg&&gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)});
setInterval(()=>{draw();lines.scrollTop=(lines.scrollTop+22)%(lines.scrollHeight-100)},80);
</script>
