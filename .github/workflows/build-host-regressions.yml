name: Build host regressions
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', '.github/workflows/build-host-regressions.yml']
permissions:
  contents: read
jobs:
  build-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/rootfs-build-lib.sh scripts/select-qemu-user-package.sh scripts/install-build-deps.sh scripts/check-build-deps.sh scripts/build-ufs-image.sh scripts/build-ubuntu-rootfs.sh
      - name: Test QEMU package selection and timezone-independent bootstrap
        run: |
          python3 scripts/test-build-host-tools.py
          python3 scripts/test-update-bootstrap.py
      - name: Test mount cleanup and a temporary ext4 image
        run: sudo python3 scripts/test-rootfs-build.py
