# Closing the cover just after waking up has to work too.
#
# logind ignores the lid switch for HoldoffTimeoutSec after every resume, 30 s
# by default.  On a laptop that is nearly free: you rarely shut the lid five
# seconds after opening it.  On a tablet whose cover *is* the off switch it is
# the common case -- wake it, look at the lock screen, change your mind, close
# the cover -- and for half a minute nothing happens.
#
# Measured on hardware before touching this: of eleven cover closes in one boot,
# every one more than 30 s after a resume suspended, and every one inside that
# window was dropped.  Eleven for eleven, so this is the whole of it; the
# digitiser and logind were both doing their job.
#
# The holdoff guards against a lid that re-announces itself on resume and
# suspends the machine straight back.  Neither reporter here does that: the
# digitiser sends a packet only when the state actually changes, and gpio-keys is
# only read on a real edge.  Five seconds is kept rather than zero so that a
# resume still has a moment to settle, which is all the guard was ever for.
[Login]
HoldoffTimeoutSec=5s
