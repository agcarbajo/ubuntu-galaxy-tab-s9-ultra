# The power button belongs to ubuntu-gts9u-powerkey.service, which is the only
# place that can do both halves of what this device needs: a short press
# suspends, a long press brings up GNOME's shutdown dialog.
#
# logind can tell the two presses apart but can only run its own fixed actions,
# and its default here is HandlePowerKey=poweroff - an immediate, unconfirmed
# power off on a single tap.  Stand it down so the two never race.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
