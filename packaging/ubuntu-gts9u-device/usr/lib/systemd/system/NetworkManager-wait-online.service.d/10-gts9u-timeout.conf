# A tablet whose Wi-Fi does not come up waits out this unit's full timeout
# on every boot, and two owners report exactly that pair of symptoms: no
# Wi-Fi and a boot that takes forever (#8, #11).  Nothing in this port's
# desktop needs the network to be up before the greeter, so the wait is
# capped.
#
# Twenty seconds, and a failure that is not one.  The first cap was ten, and
# measured on the development unit it turned a working Wi-Fi into a failed
# unit on every boot: association takes 15 to 18 s here, nm-online gave up at
# ten and exited non-zero.  The leading "-" keeps a slow network from showing
# up as a failed unit; what it means now is "we waited this long", which is
# all network-online.target ever meant on a tablet.
[Service]
ExecStart=
ExecStart=-/usr/bin/nm-online -s -q --timeout=20
