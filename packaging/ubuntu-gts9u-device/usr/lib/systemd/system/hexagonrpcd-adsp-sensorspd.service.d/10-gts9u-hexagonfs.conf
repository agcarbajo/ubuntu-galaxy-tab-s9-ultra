# Point hexagonrpcd at this device's HexagonFS tree and order it after the DSP
# is actually up.
#
# The tree is the Samsung sensor registry staged by the firmware overlay.  The
# daemon stays confined to the directory given with -R, so this never exposes
# the real Android persist partition.
[Unit]
Requires=ubuntu-gts9u-adsp-boot.service ubuntu-gts9u-sensor-registry.service
# The mandatory panel cold-boot recovery performs a deep suspend while boot is
# still in progress.  Starting the sensor protection domain inside that cycle
# races ADSP power collapse and leaves the handover IRQ asserted.  Attach only
# after the platform has resumed and the panel recovery unit has returned.
After=ubuntu-gts9u-adsp-boot.service pd-mapper.service ubuntu-gts9u-sensor-registry.service
After=ubuntu-gts9u-panel-coldboot-recover.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm8550/Samsung/gts9uwifi
# A failed sensor-PD attach can take the shared ADSP down with it, and the ADSP
# is also what audio depends on.  One controlled attempt per boot, no automatic
# crash loop.
Restart=no
