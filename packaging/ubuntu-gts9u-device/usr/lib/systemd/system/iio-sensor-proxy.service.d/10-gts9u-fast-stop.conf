# No esperar minuto y medio por un proceso que no va a contestar.
#
# iio-sensor-proxy nunca atiende el SIGTERM del apagado en este aparato: la
# espera sincrona de libssc lo deja bloqueado en poll() en vez de iterar el
# contexto, y un proceso parado ahi no procesa senales. systemd cumple su
# plazo por defecto de 90 s y lo mata igualmente, asi que esos 90 s son tiempo
# muerto con la pantalla ya apagada y el cursor parpadeando.
#
# Matarlo antes no pierde nada: no tiene estado que guardar, solo lee sensores
# a traves del SSC. Esto no arregla la causa —eso es libssc— pero convierte el
# minuto y medio en cinco segundos.
[Service]
TimeoutStopSec=5s
KillSignal=SIGKILL
