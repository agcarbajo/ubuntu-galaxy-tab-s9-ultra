# pd-mapper resolves the protection domains ("avs/audio" -> "msm/adsp/audio_pd")
# that the q6apm/q6prm DT nodes wait on, and it finds its *.jsn maps by reading
# /sys/class/remoteproc/*/firmware and scanning that firmware's own directory.
# Both need the ADSP remoteproc to be up first, and this port starts it late,
# because auto_boot fires long before the microSD holding the firmware is
# mounted.
#
# Without this ordering pd-mapper runs too early, finds no remoteproc, and
# systemd gives up on it after the start limit.
[Unit]
After=ubuntu-gts9u-adsp-boot.service
Wants=ubuntu-gts9u-adsp-boot.service

[Service]
Restart=on-failure
RestartSec=3
