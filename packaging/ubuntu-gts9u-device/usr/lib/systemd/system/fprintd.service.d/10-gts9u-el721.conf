[Unit]
Requires=ubuntu-gts9u-qcomtee.service ubuntu-gts9u-fingerprint-ui.service ubuntu-gts9u-fingerprint-secure.service
After=ubuntu-gts9u-qcomtee.service ubuntu-gts9u-fingerprint-ui.service ubuntu-gts9u-fingerprint-secure.service

[Service]
ExecStartPre=/usr/libexec/ubuntu-gts9u-fingerprint-secure --wait
TimeoutStartSec=75
# fprintd's stock sandbox permits USB, SPI and hidraw only.  QCOMTEE appears
# before this unit starts because of the dependency above, so systemd can bind
# the exact character device without weakening the rest of the policy.
DeviceAllow=/dev/tee0 rw
# HwVault rebuilds its volatile key cache from the K250A secure element before
# dualfp can encrypt or decrypt a template.
DeviceAllow=/dev/k250a rw
# Keep the device-local Gatekeeper identity outside fprintd's per-user print
# store while making its root-only directory writable through ProtectSystem.
StateDirectory=gts9u-fingerprint
StateDirectoryMode=0700
# A root-writable, publicly readable lease for the waiting icon. This is not
# an authentication channel and contains no biometric data or user identity.
RuntimeDirectory=gts9u-fingerprint
RuntimeDirectoryMode=0755
ExecStopPost=/usr/libexec/ubuntu-gts9u-fingerprint-cleanup
