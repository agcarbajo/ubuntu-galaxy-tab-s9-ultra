# hexagonrpcd runs unprivileged, as the fastrpc user its own udev rule hands
# /dev/fastrpc-* to.  Samsung's sensor firmware writes into the registry cache
# it is given with -R: it opens sns_reg_version and temp.json with fopen("w")
# before publishing sns_registry.
#
# The tree arrives from the TWRP overlay owned by root, so without this the
# daemon logs "Could not open .../sns_reg_version: Permission denied".  Z is
# recursive and applies on every boot, which also repairs a tree reinstalled by
# a later ZIP.
Z /usr/share/qcom/sm8550/Samsung/gts9uwifi - fastrpc fastrpc - -
