# Swap tuning for the SM-X910, where the first swap tier is zram.
#
# swappiness 100 rather than the stock 60: with a compressed tier in front,
# evicting an anonymous page is cheap, and preferring it over dropping page
# cache is what keeps a browser plus a Proton game responsive.  It is not the
# 180 that a zram-only machine would use, because this board also has a real
# swapfile behind zram and 180 would push it to the UFS sooner than needed.
vm.swappiness = 100

# zram has no seek penalty and no readahead to amortise, so faulting in
# clusters of neighbouring pages only wastes decompression work.
vm.page-cluster = 0
