<?xml version="1.0" standalone="yes"?>
<!--
    Mesa names this GPU "FD740" over OpenGL, its own shorthand for the
    seventh-generation Adreno at 4.0.  That is the string every GL application
    shows: Minecraft's F3 overlay, glxinfo, anything printing GL_RENDERER.
    Vulkan already reports "Turnip Adreno (TM) 740", so the two APIs disagreed
    about the same silicon.

    force_gl_renderer is Mesa's own supported knob for exactly this; its
    default configuration uses it for other Adreno parts.  No patched Mesa is
    needed, and an Ubuntu update cannot undo it.

    GL_VENDOR is set to "Qualcomm" for the same reason: it is the name on the
    box, and tools that show a GPU concatenate vendor and renderer, so leaving
    it as "freedreno" produced "freedreno Adreno (TM) 740".  The cost is that
    the open driver no longer identifies itself as such over GL, and a few
    applications do branch on that string to pick workarounds.  Nothing on
    this device has been seen to care, and one file reverts it.

    Vulkan is unaffected and still reports "Turnip Adreno (TM) 740": that name
    is built from a fixed format string inside the Turnip driver, with no
    configuration knob, so changing it would mean carrying a patched Mesa.

    Note for anyone editing this file: a double hyphen is illegal inside an
    XML comment, and Mesa discards the whole file without a word when it
    cannot parse it.  That silence already cost one debugging session.
-->
<driconf>
    <device driver="msm" device="FD740">
        <application name="Default">
            <option name="force_gl_renderer" value="Adreno (TM) 740"/>
            <option name="force_gl_vendor" value="Qualcomm"/>
        </application>
    </device>
</driconf>
