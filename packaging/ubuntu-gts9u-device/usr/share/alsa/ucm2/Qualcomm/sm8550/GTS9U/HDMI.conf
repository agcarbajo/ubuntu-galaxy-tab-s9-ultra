SectionVerb {
	EnableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 1"
	]
	DisableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 0"
	]
	Value.TQ "HiFi"
}

SectionDevice."HDMI" {
	Comment "HDMI / DisplayPort"
	Value {
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
		PlaybackPriority 200
		JackControl "DP0 Jack"
	}
}

# Selecting an external output must retain the tablet microphones.
Include.mic.File "/Qualcomm/sm8550/GTS9U/Mic.conf"
